[pytest]
# Django settings module
DJANGO_SETTINGS_MODULE = crm.settings

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:warnings

# Markers for organizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    auth: Authentication tests
    leads: Lead module tests
    users: User module tests

# Django database configuration for tests
# Reuse database to speed up tests
# --reuse-db flag will reuse the test database between runs
# --create-db flag will force recreation of test database

# Coverage options (if using pytest-cov)
# --cov=common --cov=leads --cov=accounts
# --cov-report=html
# --cov-report=term-missing